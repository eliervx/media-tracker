services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: media-tracker-db
    restart: always
    environment:
      POSTGRES_USER: your_postgres_user
      POSTGRES_PASSWORD: your_postgres_pwd
      POSTGRES_DB: your_db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_postgres_user -d your_db_name"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend NestJS
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: media-tracker-back
    restart: always
    env_file:
      - ./back/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend NextJS
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: media-tracker-front
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data: